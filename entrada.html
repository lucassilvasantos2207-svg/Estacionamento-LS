<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrada de Veículos | Estacionamento LS</title>

    <link rel="stylesheet" href="css/style.css">

    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

   
    <nav class="sidebar">

        <div class="logo">
           <i class="fa-solid fa-car"></i>
            <h2>Estacionamento LS</h2>
        </div>

        <ul>

            <li>
                <a href="index.html">
                    <i class="fa-solid fa-house"></i>
                    Home
                </a>
            </li>

            <li class="active">
                <a href="entrada.html">
                    <i class="fa-solid fa-car"></i>
                    Entrada
                </a>
            </li>

            <li>
                <a href="veiculos.html">
                    <i class="fa-solid fa-list"></i>
                    Veículos
                </a>
            </li>

            <li>
                <a href="saida.html">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    Saída
                </a>
            </li>

            <li>
                <a href="relatorios.html">
                    <i class="fa-solid fa-chart-column"></i>
                    Relatórios
                </a>
            </li>

        </ul>

    </nav>

  
    <main class="conteudo">

        <header class="topo">

            <h1>Registrar Entrada</h1>

            <p>
                Cadastre um veículo para iniciar o estacionamento.
            </p>

        </header>

        <section class="form-card">

            <form id="formEntrada">

                <div class="campo">

                    <label for="placa">
                        <i class="fa-solid fa-id-card"></i>
                        Placa
                    </label>

                    <input
                        type="text"
                        id="placa"
                        placeholder="ABC1D23"
                        maxlength="7"
                        required>

                </div>

                <div class="campo">

                    <label for="modelo">
                        <i class="fa-solid fa-car-side"></i>
                        Modelo
                    </label>

                    <input
                        type="text"
                        id="modelo"
                        placeholder="Corolla"
                        required>

                </div>

                <div class="campo">

                    <label for="marca">
                        <i class="fa-solid fa-industry"></i>
                        Marca
                    </label>

                    <input
                        type="text"
                        id="marca"
                        placeholder="Toyota"
                        required>

                </div>

                <div class="campo">

                    <label for="cor">
                        <i class="fa-solid fa-palette"></i>
                        Cor
                    </label>

                    <input
                        type="text"
                        id="cor"
                        placeholder="Prata"
                        required>

                </div>

                <div class="campo">

                    <label for="tipo">
                        <i class="fa-solid fa-truck"></i>
                        Tipo de Veículo
                    </label>

                    <select id="tipo">

                        <option value="Carro">Carro</option>

                        <option value="Moto">Moto</option>

                        <option value="Caminhonete">Caminhonete</option>

                        <option value="Van">Van</option>

                    </select>

                </div>

                <div class="campo">

                    <label for="vaga">
                        <i class="fa-solid fa-square-parking"></i>
                        Número da Vaga
                    </label>

                    <input
                        type="number"
                        id="vaga"
                        placeholder="15"
                        min="1"
                        required>

                </div>

                <button type="submit">

                    <i class="fa-solid fa-circle-plus"></i>

                    Registrar Entrada

                </button>

            </form>

        </section>

    </main>

    <script src="js/script.js"></script>

</body>

</html>
